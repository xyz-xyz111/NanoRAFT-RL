# PPO稳定训练配置：RTX 4090 24GB、TRL 0.7.4
model:
  sft_model_path: "outputs/raft-sft/final"
  base_model: "Qwen/Qwen2-7B-Instruct"
  trust_remote_code: true

seed: 42

ppo:
  learning_rate: 5.0e-7
  batch_size: 1
  mini_batch_size: 1
  gradient_accumulation_steps: 1
  ppo_epochs: 1
  clip_range: 0.1
  clip_range_value: 0.1
  gamma: 0.99
  lam: 0.95
  max_new_tokens: 96
  temperature: 0.6
  top_p: 0.9
  total_steps: 60
  logging_steps: 1
  save_steps: 10
  max_kl: 30
  max_high_kl_steps: 3

reward:
  components:
    format_compliance:
      weight: 0.5
    reasoning_structure:
      weight: 0.2
    appropriate_length:
      weight: 0.2
    length_penalty:
      max_penalty: -0.4

data:
  train_file: "data/synthetic/train.jsonl"
  val_file: "data/synthetic/val.jsonl"
  max_samples: 200
  max_seq_length: 768

memory:
  load_in_4bit: true
  reward_model_on_cpu: true
  ref_model_4bit: true
  empty_cache_freq: 10

output:
  output_dir: "outputs/raft-ppo-improved"
  save_merged_model: true

evaluation:
  eval_freq: 20
  eval_samples: 30
